<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Join EmailFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { min-height: 100vh; background: var(--bg-body); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { width: 100%; max-width: 550px; padding: 50px; border-radius: 30px; box-shadow: var(--shadow); background: var(--bg-card); }
        .logo-center { display: flex; justify-content: center; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div style="position: fixed; top: 30px; right: 30px; display: flex; gap: 15px; z-index: 1000;">
        <button class="icon-btn" id="theme-toggle"><i class="ri-moon-line"></i></button>
        <button class="btn btn-outline" id="rtl-toggle" style="padding: 0 15px; height: 40px; border-radius: 12px; font-size: 0.8rem; font-weight: 700;">RTL</button>
                </div>
    <div class="login-card glass">
        <div class="logo-center">
            <a href="../index.html" class="logo">
                <img src="../assets/images/logo.svg" alt="Logo" class="logo-icon">
                <span class="brand-name">EmailFlow.</span>
            </a>
                </div>
        <div style="text-align: center; margin-bottom: 30px;">
            <h2>Create Account</h2>
            <p style="color: var(--text-muted);">Start your 14-day free trial</p>
                </div>
        
        <form action="dashboard.html" style="display: grid; gap: 20px;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                <div style="display: grid; gap: 8px;">
                    <label style="font-weight: 600; font-size: 0.9rem;">First Name</label>
                    <input type="text" placeholder="John" required style="padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); outline: none;">
                </div>
                <div style="display: grid; gap: 8px;">
                    <label style="font-weight: 600; font-size: 0.9rem;">Last Name</label>
                    <input type="text" placeholder="Doe" required style="padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); outline: none;">
                </div>
                </div>
            <div style="display: grid; gap: 8px;">
                <label style="font-weight: 600; font-size: 0.9rem;">Work Email</label>
                <input type="email" placeholder="john@company.com" required style="padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); outline: none;">
                </div>
            <div style="display: grid; gap: 8px;">
                <label style="font-weight: 600; font-size: 0.9rem;">Password</label>
                <input type="password" placeholder="********" required style="padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); outline: none;">
                <div style="height: 4px; background: var(--border); border-radius: 2px; margin-top: 5px;">
                    <div style="width: 60%; height: 100%; background: #fbbf24; border-radius: 2px;"></div>
                </div>
                <span style="font-size: 0.75rem; color: var(--text-muted);">Password strength: Medium</span>
                </div>
            <button type="submit" class="btn btn-primary" style="padding: 15px; border-radius: 12px; width: 100%;">Create Account</button>
        </form>

        <div style="margin: 30px 0; text-align: center; position: relative;">
            <span style="background: var(--bg-card); padding: 0 15px; position: relative; z-index: 2; color: var(--text-muted); font-size: 0.9rem;">OR SIGN UP WITH</span>
            <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border);"></div>
                </div>

        <div style="display: flex; gap: 15px;">
            <button class="icon-btn" style="flex: 1; border-radius: 12px; width: auto; color: #DB4437;"><i class="ri-google-fill"></i></button>
            <button class="icon-btn" style="flex: 1; border-radius: 12px; width: auto; color: #1877F2;"><i class="ri-facebook-fill"></i></button>
            <button class="icon-btn" style="flex: 1; border-radius: 12px; width: auto; color: var(--text-main);"><i class="ri-apple-fill"></i></button>
                </div>

        <p style="text-align: center; margin-top: 30px; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Login</a>
        </p>

                </div>

    <script src="../assets/js/main.js"></script>
</body>
</html>
