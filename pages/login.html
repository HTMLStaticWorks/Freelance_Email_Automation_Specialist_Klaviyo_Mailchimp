<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../assets/js/theme-init.js"></script>
    <title>Login | EmailFlow Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { min-height: 100vh; background: var(--bg-body); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { width: 100%; max-width: 450px; padding: 50px; border-radius: 30px; box-shadow: var(--shadow); background: var(--bg-card); }
        .logo-center { display: flex; justify-content: center; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div style="position: fixed; top: 30px; right: 30px; display: flex; gap: 15px; z-index: 1000;">
        <button class="icon-btn" id="theme-toggle"><i class="ri-moon-line"></i></button>
        <button class="btn btn-outline" id="rtl-toggle" style="padding: 0 15px; height: 40px; border-radius: 12px; font-size: 0.8rem; font-weight: 700;">RTL</button>
                </div>
    <div class="login-card glass">
        <div class="logo-center">
            <a href="../index.html" class="logo">
                <img src="../assets/images/logo.svg" alt="Logo" class="logo-icon">
                <span class="brand-name">EmailFlow.</span>
            </a>
                </div>
        <div style="text-align: center; margin-bottom: 40px;">
            <h2>Welcome Back</h2>
            <p style="color: var(--text-muted);">Enter your credentials to continue</p>
                </div>
        
        <form action="dashboard.html" style="display: grid; gap: 20px;">
            <div style="display: grid; gap: 8px;">
                <label style="font-weight: 600; font-size: 0.9rem;">Email Address</label>
                <input type="email" placeholder="name@company.com" required style="padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); outline: none;">
                </div>
            <div style="display: grid; gap: 8px;">
                <label style="font-weight: 600; font-size: 0.9rem;">Password</label>
                <input type="password" placeholder="********" required style="padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); outline: none;">
                </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                <label style="display: flex; gap: 8px; cursor: pointer;"><input type="checkbox"> Remember me</label>
                <a href="#" style="color: var(--primary); text-decoration: none;">Forgot password?</a>
                </div>
            <button type="submit" class="btn btn-primary" style="padding: 15px; border-radius: 12px; width: 100%;">Login <i class="ri-login-box-line"></i></button>
        </form>

        <div style="margin: 30px 0; text-align: center; position: relative;">
            <span style="background: var(--bg-card); padding: 0 15px; position: relative; z-index: 2; color: var(--text-muted); font-size: 0.9rem;">OR CONTINUE WITH</span>
            <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border);"></div>
                </div>

                <div style="display: flex; gap: 15px;">
            <button class="icon-btn" style="flex: 1; border-radius: 12px; width: auto; color: #DB4437;"><i class="ri-google-fill"></i></button>
            <button class="icon-btn" style="flex: 1; border-radius: 12px; width: auto; color: #1877F2;"><i class="ri-facebook-fill"></i></button>
            <button class="icon-btn" style="flex: 1; border-radius: 12px; width: auto; color: var(--text-main);"><i class="ri-apple-fill"></i></button>
                </div>

        <p style="text-align: center; margin-top: 30px; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign up</a>
        </p>

                </div>

    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
